<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" font-family='"Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif' aria-label="怎么选：要规划改良设施时看 Empire Planner 或 Auto Map Tacks Planner，否则看 District &amp; Wonder Planner 或本模组"><defs><marker id="dc-arrow-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0ba"/></marker></defs><rect x="10" y="120" width="190" height="60" rx="8" fill="none" stroke="#2a3a44" stroke-width="1.4"/><text x="105" y="145" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">也要规划改良设施</text><text x="105" y="163" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">（农场、矿山……）？</text><rect x="270" y="30" width="230" height="60" rx="8" fill="none" stroke="#2a3a44" stroke-width="1.4"/><text x="385" y="55" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">不想装 DMT，或想一次</text><text x="385" y="73" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">排好全部城市和新城址？</text><rect x="270" y="210" width="230" height="60" rx="8" fill="none" stroke="#2a3a44" stroke-width="1.4"/><text x="385" y="235" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">勾上全部城市，</text><text x="385" y="253" text-anchor="middle" font-size="12.5" font-weight="400" fill="#e3eaee">一起排几个核心区域？</text><rect x="580" y="0" width="250" height="50" rx="8" fill="#173039" stroke="#6ab9c6" stroke-width="1.4"/><text x="705" y="20" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e3eaee">Empire Planner</text><text x="705" y="38" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9fb0ba">整个帝国一次规划，不依赖 DMT</text><rect x="580" y="70" width="250" height="50" rx="8" fill="#173039" stroke="#6ab9c6" stroke-width="1.4"/><text x="705" y="90" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e3eaee">Auto Map Tacks Planner</text><text x="705" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9fb0ba">按人口做长期蓝图，最多 4 城</text><rect x="580" y="180" width="250" height="50" rx="8" fill="#173039" stroke="#6ab9c6" stroke-width="1.4"/><text x="705" y="200" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e3eaee">District &amp; Wonder Planner</text><text x="705" y="218" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9fb0ba">简单面板，全部城市一起</text><rect x="580" y="250" width="250" height="50" rx="8" fill="#173039" stroke="#6ab9c6" stroke-width="1.4"/><text x="705" y="270" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e3eaee">本模组</text><text x="705" y="288" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9fb0ba">选城址；注明是否最优、离上界多远</text><path d="M200 150 L235 150 L235 60 L268 60" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="241" y="54" font-size="12" fill="#6ab9c6">是</text><path d="M200 150 L235 150 L235 240 L268 240" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="241" y="234" font-size="12" fill="#6ab9c6">否</text><path d="M500 60 L540 60 L540 25 L578 25" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="546" y="19" font-size="12" fill="#6ab9c6">是</text><path d="M500 60 L540 60 L540 95 L578 95" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="546" y="89" font-size="12" fill="#6ab9c6">否</text><path d="M500 240 L540 240 L540 205 L578 205" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="546" y="199" font-size="12" fill="#6ab9c6">是</text><path d="M500 240 L540 240 L540 275 L578 275" fill="none" stroke="#9fb0ba" stroke-width="1.4" marker-end="url(#dc-arrow-zh)"/><text x="546" y="269" font-size="12" fill="#6ab9c6">否</text></svg>
