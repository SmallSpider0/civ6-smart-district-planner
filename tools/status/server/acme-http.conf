# Optional: port 80 for an HTTP-01 certificate (Let's Encrypt), e.g. /etc/nginx/conf.d/acme-http.conf.
# Serves the challenge files from <acme-webroot>; everything else goes to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name <page-host> _;
    location ^~ /.well-known/acme-challenge/ {
        root <acme-webroot>;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
