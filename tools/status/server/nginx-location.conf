# Status page: static files pushed by tools/status/sync.py. Include it inside the HTTPS server block,
# e.g. as /etc/nginx/snippets/status-location.conf with `include snippets/status-location.conf;`.
# <page-path> is a long random string (the page has no login: whoever has the link can read it);
# <web-root> is the folder status-receive writes into.
location = /<page-path> { return 301 /<page-path>/; }
location ^~ /<page-path>/ {
    alias <web-root>/;
    index index.html;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
}
