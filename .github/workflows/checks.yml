# Static checks and offline tests on every pull request. They do not run
# again on main after the merge (the squashed commit is what the pull request
# tested); run them there by hand (workflow_dispatch) when needed.
# The in-game tests and the comparison need the game; they run on our machines.
name: checks

on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run still going for it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Only documents changed (docs/, .md files, the issue templates):
      # validate still runs (it also checks CHANGELOG.md against the panel's
      # VERSION), the offline tests (several minutes) are skipped. The job
      # reports success either way, so the required checks are met.
      - name: What changed
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          code=$(echo "$files" | grep -v -E '^docs/|^\.github/ISSUE_TEMPLATE/|\.md$' || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tool dependencies
        run: npm ci
        working-directory: tools
      - name: validate.py (no reference/ here, so the UI precedent check is skipped)
        run: python -I tools/validate.py
      - name: Offline tests
        if: steps.scope.outputs.code == 'true'
        run: node tools/offline_tests.mjs
