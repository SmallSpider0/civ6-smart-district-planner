# When a release is published: attach the mod package, the one-file page and
# the Steam Workshop upload package to it, and publish the page (introduction
# and evaluation) on GitHub Pages. A pre-release (v1.1.0-rc.1) gets the files
# but leaves the page alone. Run by hand (workflow_dispatch) it rebuilds the
# page from the chosen ref. The Workshop upload itself is done by hand on
# Windows (docs/workshop-upload.md).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      VERSION: ${{ github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tool dependencies
        run: npm ci
        working-directory: tools
      - name: Build the page
        run: |
          if [ -n "$VERSION" ]; then
            python -I report/build.py --version "$VERSION" --site _site
          else
            python -I report/build.py --site _site
          fi
      - name: Build the mod package
        run: python -I tools/package.py ${VERSION:+--version "$VERSION"}
      - name: Attach the package and the page to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/report/report.html "dist/SmartDistrictPlanner-$VERSION-page.html"
          cp dist/report/report_en.html "dist/SmartDistrictPlanner-$VERSION-page-en.html"
          gh release upload "$VERSION" "dist/SmartDistrictPlanner-$VERSION.zip" "dist/SmartDistrictPlanner-$VERSION-page.html" \
            "dist/SmartDistrictPlanner-$VERSION-page-en.html" --clobber
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  workshop:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the Workshop upload package
        run: python -I tools/workshop.py pack "$VERSION"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "dist/SmartDistrictPlanner-$VERSION-workshop.zip" --clobber

  deploy:
    needs: build
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
